name: Bug report
description: Report something that is not working
labels:
- bug
body:
- type: textarea
  id: what
  attributes:
    label: What happened?
    description: Describe the bug and what you expected instead.
  validations:
    required: true
- type: textarea
  id: steps
  attributes:
    label: Steps to reproduce
    description: Numbered steps, as exact as possible.
  validations:
    required: true
- type: dropdown
  id: area
  attributes:
    label: Area
    options:
    - C reference (c/)
    - Python model (python/)
    - Protocol / docs
  validations:
    required: true
- type: input
  id: env
  attributes:
    label: OS, compiler and Python versions
    description: e.g. Ubuntu 24.04, gcc 13.2 (`gcc --version`), Python 3.12.
  validations:
    required: true
- type: textarea
  id: input
  attributes:
    label: Packet or vector that triggers it
    description: Hex dump of the failing input, if any.
    render: text
  validations:
    required: false
- type: input
  id: commit
  attributes:
    label: Commit
    description: Output of `git rev-parse --short HEAD`.
  validations:
    required: true
- type: textarea
  id: logs
  attributes:
    label: Logs or output
    description: Paste relevant output. It will be formatted as code. Remove personal data first.
    render: shell
  validations:
    required: false
