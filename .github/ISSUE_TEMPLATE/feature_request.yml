name: Feature request
description: Suggest an improvement
labels:
- enhancement
body:
- type: textarea
  id: problem
  attributes:
    label: Problem or motivation
    description: What are you trying to do that is hard today?
  validations:
    required: true
- type: textarea
  id: proposal
  attributes:
    label: Proposed solution
    description: Describe what you would like to see.
  validations:
    required: true
- type: textarea
  id: alternatives
  attributes:
    label: Alternatives considered
    description: Other approaches you thought about.
  validations:
    required: false
- type: textarea
  id: hw
  attributes:
    label: Memory / hardware impact
    description: RAM/flash budget, allocation or timing constraints. The C reference is allocation-free.
  validations:
    required: false
